services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:-change-me-admin}
      APP_USER: ${ORACLE_DB_USERNAME:-learning_app}
      APP_USER_PASSWORD: ${ORACLE_DB_PASSWORD:-change-me}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
  app:
    build: .
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      ORACLE_JDBC_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      ORACLE_DB_USERNAME: ${ORACLE_DB_USERNAME:-learning_app}
      ORACLE_DB_PASSWORD: ${ORACLE_DB_PASSWORD:-change-me}
    ports:
      - "8080:8080"
volumes:
  oracle-data:
