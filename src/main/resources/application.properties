spring.application.name=java-learning-support
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.thymeleaf.cache=false
spring.datasource.url=${ORACLE_JDBC_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_DB_USERNAME:learning_app}
spring.datasource.password=${ORACLE_DB_PASSWORD:change-me}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=${ORACLE_DB_POOL_SIZE:5}
spring.sql.init.mode=never
